<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brain Master Quiz</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .stat-box {
      font-size: 14px;
      font-weight: 700;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      padding: 22px 18px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .timer-badge {
      color: var(--warning);
      font-weight: bold;
    }

    .question {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 50px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: #334155;
      color: var(--text);
      border: 1px solid #475569;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.correct {
      background-color: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }

    .btn.wrong {
      background-color: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }

    .ad-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 15px;
      display: none;
      text-align: center;
      width: 100%;
    }

    .status-text {
      font-size: 13px;
      margin-top: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="stat-box">Score: <span id="score" style="color: var(--primary);">0</span></div>
      <div class="stat-box">Lives: <span id="lives" style="color: var(--danger);">❤️❤️❤️</span></div>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="card" id="game-card">
      <div class="top-meta">
        <span id="q-counter">Question 1/10</span>
        <span class="timer-badge">⏳ <span id="timer">15</span>s</span>
      </div>

      <div class="question" id="question-text">Loading question...</div>
      <div class="options-grid" id="options-box"></div>
      
      <!-- Optional Rewarded Ad Button -->
      <button class="btn ad-btn" id="revive-btn" onclick="showRewardAd()">
        📺 Watch Ad to Get +1 Life
      </button>
      
      <div class="status-text" id="status-msg">Choose the correct answer before time runs out!</div>
    </div>
  </div>

  <script>
    // 1. Safe Telegram WebApp Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {
        console.log("Telegram SDK not active in browser");
      }
    }

    // 2. Safe AdsGram Initialization with error handling
    let AdController = null;
    try {
      if (window.Adsgram) {
        // Adsgram ID ലഭിക്കുമ്പോൾ "YOUR_BLOCK_ID_HERE" മാറ്റി നൽകുക
        AdController = window.Adsgram.init({ blockId: "int-0000" });
      }
    } catch (e) {
      console.warn("Adsgram is running in safe mode:", e);
    }

    // 3. Quiz Questions Database
    const quizData = [
      { q: "What is the capital city of France?", opt: ["Berlin", "Paris", "Rome", "Madrid"], ans: 1 },
      { q: "Which planet is known as the Red Planet?", opt: ["Earth", "Mars", "Jupiter", "Venus"], ans: 1 },
      { q: "What is the fastest land animal in the world?", opt: ["Cheetah", "Lion", "Falcon", "Horse"], ans: 0 },
      { q: "Which element has the chemical symbol 'O'?", opt: ["Gold", "Oxygen", "Iron", "Silver"], ans: 1 },
      { q: "Which ocean is the largest on Earth?", opt: ["Atlantic", "Indian", "Pacific", "Arctic"], ans: 2 },
      { q: "How many continents are there on Earth?", opt: ["5", "6", "7", "8"], ans: 2 },
      { q: "Who painted the Mona Lisa?", opt: ["Van Gogh", "Picasso", "Leonardo da Vinci", "Michelangelo"], ans: 2 },
      { q: "Which is the smallest country in the world?", opt: ["Monaco", "Vatican City", "Maldives", "Malta"], ans: 1 },
      { q: "What is the hardest natural substance on Earth?", opt: ["Diamond", "Gold", "Iron", "Platinum"], ans: 0 },
      { q: "Which country is the home of the Kangaroo?", opt: ["Australia", "South Africa", "Brazil", "India"], ans: 0 }
    ];

    let currentQuestion = 0;
    let score = 0;
    let lives = 3;
    let timeLeft = 15;
    let timerInterval = null;

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 15;
      document.getElementById("timer").innerText = timeLeft;
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function renderQuestion() {
      if (lives <= 0) {
        showGameOver();
        return;
      }

      startTimer();
      const q = quizData[currentQuestion];
      
      // Update UI texts
      document.getElementById("question-text").innerText = q.q;
      document.getElementById("q-counter").innerText = `Question ${currentQuestion + 1}/${quizData.length}`;
      document.getElementById("progress-bar").style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
      
      const optContainer = document.getElementById("options-box");
      optContainer.innerHTML = "";
      document.getElementById("revive-btn").style.display = "none";
      document.getElementById("status-msg").innerText = "Select an option!";

      q.opt.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = `${String.fromCharCode(65 + index)}.  ${option}`;
        btn.onclick = () => checkAnswer(index, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, buttonElement) {
      clearInterval(timerInterval);
      const q = quizData[currentQuestion];
      const buttons = document.querySelectorAll("#options-box .btn");
      buttons.forEach(b => b.disabled = true);

      if (selected === q.ans) {
        buttonElement.classList.add("correct");
        score += 10;
        document.getElementById("score").innerText = score;
        document.getElementById("status-msg").innerText = "🎉 Correct answer! +10 Points";
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        buttonElement.classList.add("wrong");
        buttons[q.ans].classList.add("correct");
        lives -= 1;
        updateLives();
        document.getElementById("status-msg").innerText = "❌ Incorrect answer!";
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      }

      setTimeout(() => {
        nextQuestion();
      }, 1300);
    }

    function handleTimeOut() {
      const buttons = document.querySelectorAll("#options-box .btn");
      buttons.forEach(b => b.disabled = true);
      const q = quizData[currentQuestion];
      buttons[q.ans].classList.add("correct");
      
      lives -= 1;
      updateLives();
      document.getElementById("status-msg").innerText = "⏰ Time's up!";
      
      setTimeout(() => {
        nextQuestion();
      }, 1300);
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= quizData.length) {
        showWinScreen();
      } else {
        renderQuestion();
      }
    }

    function updateLives() {
      let heartStr = "";
      for (let i = 0; i < lives; i++) heartStr += "❤️";
      document.getElementById("lives").innerText = heartStr || "0";
    }

    function showGameOver() {
      clearInterval(timerInterval);
      document.getElementById("question-text").innerText = "Game Over! You lost all lives.";
      document.getElementById("options-box").innerHTML = "";
      document.getElementById("status-msg").innerText = "Watch an ad to get +1 extra life, or restart free.";
      
      const reviveBtn = document.getElementById("revive-btn");
      reviveBtn.style.display = "block";

      const restartBtn = document.createElement("button");
      restartBtn.className = "btn";
      restartBtn.style.textAlign = "center";
      restartBtn.style.marginTop = "10px";
      restartBtn.innerText = "🔄 Restart Free";
      restartBtn.onclick = resetGame;
      document.getElementById("options-box").appendChild(restartBtn);
    }

    function showWinScreen() {
      clearInterval(timerInterval);
      document.getElementById("question-text").innerText = `🏆 Completed! Final Score: ${score}`;
      document.getElementById("options-box").innerHTML = "";
      document.getElementById("status-msg").innerText = "Great job! You finished all questions.";
      
      const restartBtn = document.createElement("button");
      restartBtn.className = "btn";
      restartBtn.style.textAlign = "center";
      restartBtn.innerText = "🎮 Play Again";
      restartBtn.onclick = resetGame;
      document.getElementById("options-box").appendChild(restartBtn);
    }

    function resetGame() {
      lives = 3;
      score = 0;
      currentQuestion = 0;
      document.getElementById("score").innerText = "0";
      updateLives();
      renderQuestion();
    }

    // Rewarded Ad handler
    function showRewardAd() {
      if (AdController) {
        AdController.show().then(() => {
          lives = 1;
          updateLives();
          renderQuestion();
        }).catch(() => {
          // Fallback if ad is still in review/test mode
          lives = 1;
          updateLives();
          renderQuestion();
        });
      } else {
        lives = 1;
        updateLives();
        renderQuestion();
      }
    }

    // Start on DOM ready
    window.addEventListener("DOMContentLoaded", () => {
      renderQuestion();
    });
  </script>
</body>
</html>
