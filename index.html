<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brain Master Quiz</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .stat-box {
      font-size: 15px;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .question {
      font-size: 19px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: #334155;
      color: var(--text);
      border: 1px solid #475569;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.correct {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.wrong {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .ad-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 15px;
      display: none;
    }

    .status-text {
      font-size: 14px;
      margin-top: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="stat-box">Score: <span id="score" style="color: var(--primary);">0</span></div>
      <div class="stat-box">Lives: <span id="lives" style="color: var(--danger);">❤️❤️❤️</span></div>
    </div>

    <div class="card" id="game-card">
      <div class="question" id="question-text">Loading question...</div>
      <div class="options-grid" id="options-box"></div>
      
      <!-- Optional Rewarded Ad Button: Basic utility works fine without it -->
      <button class="btn ad-btn" id="revive-btn" onclick="showRewardAd()">
        📺 Watch Ad to Get +1 Life
      </button>
      
      <div class="status-text" id="status-msg">Answer quickly to test your knowledge!</div>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Initialize AdsGram Block (Replace with your actual Block ID when accepted)
    // Testing mode is enabled by default so it never crashes!
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID_HERE" }) : null;

    const quizData = [
      { q: "What is the capital of France?", opt: ["Berlin", "Paris", "Rome", "Madrid"], ans: 1 },
      { q: "Which planet is known as the Red Planet?", opt: ["Earth", "Mars", "Jupiter", "Venus"], ans: 1 },
      { q: "What is the fastest land animal?", opt: ["Cheetah", "Lion", "Falcon", "Horse"], ans: 0 },
      { q: "Which element has the chemical symbol 'O'?", opt: ["Gold", "Oxygen", "Osmium", "Iron"], ans: 1 },
      { q: "Which ocean is the largest on Earth?", opt: ["Atlantic", "Indian", "Pacific", "Arctic"], ans: 2 }
    ];

    let currentQuestion = 0;
    let score = 0;
    let lives = 3;

    function renderQuestion() {
      if (lives <= 0) {
        showGameOver();
        return;
      }

      const q = quizData[currentQuestion];
      document.getElementById("question-text").innerText = q.q;
      const optContainer = document.getElementById("options-box");
      optContainer.innerHTML = "";
      document.getElementById("revive-btn").style.display = "none";
      document.getElementById("status-msg").innerText = "Choose the correct option";

      q.opt.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = option;
        btn.onclick = () => checkAnswer(index, btn);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, buttonElement) {
      const q = quizData[currentQuestion];
      const buttons = document.querySelectorAll("#options-box .btn");
      buttons.forEach(b => b.disabled = true);

      if (selected === q.ans) {
        buttonElement.classList.add("correct");
        score += 10;
        document.getElementById("score").innerText = score;
        document.getElementById("status-msg").innerText = "Correct! +10 Points";
      } else {
        buttonElement.classList.add("wrong");
        buttons[q.ans].classList.add("correct");
        lives -= 1;
        updateLives();
        document.getElementById("status-msg").innerText = "Wrong answer!";
      }

      setTimeout(() => {
        currentQuestion = (currentQuestion + 1) % quizData.length;
        renderQuestion();
      }, 1200);
    }

    function updateLives() {
      let heartStr = "";
      for (let i = 0; i < lives; i++) heartStr += "❤️";
      document.getElementById("lives").innerText = heartStr || "0";
    }

    function showGameOver() {
      document.getElementById("question-text").innerText = "Game Over! You ran out of lives.";
      document.getElementById("options-box").innerHTML = "";
      document.getElementById("status-msg").innerText = "You can restart or watch an ad to get an extra life.";
      
      const reviveBtn = document.getElementById("revive-btn");
      reviveBtn.style.display = "block";

      const restartBtn = document.createElement("button");
      restartBtn.className = "btn";
      restartBtn.style.marginTop = "10px";
      restartBtn.innerText = "🔄 Restart Game (Free)";
      restartBtn.onclick = () => {
        lives = 3;
        score = 0;
        currentQuestion = 0;
        document.getElementById("score").innerText = "0";
        updateLives();
        renderQuestion();
      };
      document.getElementById("options-box").appendChild(restartBtn);
    }

    // Adsgram Trigger Function
    function showRewardAd() {
      if (AdController) {
        AdController.show().then((result) => {
          // User finished watching the rewarded ad
          lives += 1;
          updateLives();
          renderQuestion();
        }).catch((err) => {
          // Fallback if ad failed to load (or in development test)
          console.log("Ad status:", err);
          lives += 1;
          updateLives();
          renderQuestion();
        });
      } else {
        // Fallback if SDK hasn't loaded
        lives += 1;
        updateLives();
        renderQuestion();
      }
    }

    // Initial Start
    renderQuestion();
  </script>
</body>
</html>
